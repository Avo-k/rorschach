# lichess-bot config baked into the Docker image (COPY'd to
# /opt/lichess-bot/config.yml in the Dockerfile). This is the single
# source of truth for the deployed bot — edit it here, push, and the
# autodeploy rebuild picks it up. Nothing to touch on the VM.
#
# The only thing that stays on the VM is the secret token, supplied via
# the LICHESS_TOKEN env var (.env). lichess-bot reads it through the
# LICHESS_BOT_TOKEN override that compose maps; the placeholder below is
# never used at runtime.

token: "set-via-LICHESS_BOT_TOKEN-env"   # overridden by env; do NOT put a real token here
url: "https://lichess.org/"

engine:
  dir: "/opt/rorschach"
  name: ".venv/bin/rorschach-uci"
  protocol: "uci"
  ponder: false
  silence_stderr: false                 # keep [rorschach] logs visible

  uci_options:
    Profile: balanced                   # balanced | aggressive
    TimeMs: 0                           # 0 = derive from clock; else fixed ms per move
    Elo: 0                              # 0 = auto: look weird to the opponent's own rating (600..2600 pins a fixed bucket)
    MaiaType: maia3-79m                 # maia3-5m | maia3-23m | maia3-79m

challenge:
  concurrency: 1
  accept_bot: true
  only_bot: false
  max_increment: 30
  min_increment: 0
  max_base: 600
  min_base: 60
  variants:
    - standard
  time_controls:
    - blitz
    - rapid
  modes:
    - casual
    - rated

greeting:
  hello: "Hi! I play weird-but-sound moves. Default mode: balanced — type !bal or !agg to switch. Say 'verbose' and I'll narrate what I see."
  goodbye: "gg"
  hello_spectators: "Rorschach: I play sound moves humans almost never pick. Type !eval to see how alien the last move was."
  goodbye_spectators: "Thanks for watching."
