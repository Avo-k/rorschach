[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rorschach"]

[tool.hatch.metadata]
# Required because `maia3` is pinned to a git URL (not on PyPI).
allow-direct-references = true

[project]
name = "rorschach"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Maia-3 (Chessformer, CSSLab 2026). Not on PyPI; install from git.
    "maia3 @ git+https://github.com/CSSLab/maia3.git",
    "huggingface-hub>=0.23",
    "python-chess>=1.10",
    # Pinned to match Maia-3's tested baseline.
    "torch==2.4.0",
    "python-dotenv>=1.2.2",
    "requests>=2",
    "pyyaml>=6",
]

[project.scripts]
rorschach-uci = "rorschach.uci:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
