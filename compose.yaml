# Self-host on a VM.
#
#   1. echo "LICHESS_TOKEN=lip_xxx" > .env   # required
#      echo "OPENROUTER_API_KEY=sk-or-..." >> .env  # optional, enables chat
#   2. docker compose run --rm warmup        # one-shot HF cache prefill
#   3. docker compose up -d --build
#
# There is no config.yml to manage on the VM: it is baked into the image
# from configs/config.docker.yml. Edit that file, push, redeploy.
#
# Maia-3 weights land in the hf-cache volume; the image itself stays
# at ~330 MB.

services:
  rorschach:
    build:
      context: .
      args:
        LICHESS_BOT_REF: master
    image: rorschach:latest
    container_name: rorschach
    restart: unless-stopped
    environment:
      # Secrets, supplied via .env (the repo .env is in .dockerignore and not
      # mounted, so secrets must come through here, not chat._load_env).
      # LICHESS_BOT_TOKEN is the lichess API token (overrides the placeholder
      # in the baked config.yml); LICHESS_TOKEN is the opening-explorer token
      # read by rorschach. OPENROUTER_API_KEY powers the chat personality and
      # is optional — if absent, the chat silently no-ops.
      LICHESS_TOKEN: "${LICHESS_TOKEN:?set LICHESS_TOKEN in .env or shell}"
      LICHESS_BOT_TOKEN: "${LICHESS_TOKEN:?set LICHESS_TOKEN in .env or shell}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      # config.yml is baked into the image (configs/config.docker.yml) — no
      # mount, so the deployed config is whatever is committed to the repo.
      - hf-cache:/data/huggingface
    stop_grace_period: 30s
    # 2 vCPU / 2 GB matches the deployment target in CLAUDE.md.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # One-shot: prefill the HF cache with the Maia-3 5M checkpoint so the
  # first real game doesn't block on a download during isready.
  #   docker compose run --rm warmup
  warmup:
    image: rorschach:latest
    build:
      context: .
      args:
        LICHESS_BOT_REF: master
    profiles: ["warmup"]
    volumes:
      - hf-cache:/data/huggingface
    entrypoint:
      - python
      - -c
      - "from rorschach.maia import make_predictor; make_predictor('maia3-5m')"

volumes:
  hf-cache:
